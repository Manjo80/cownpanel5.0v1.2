; PlatformIO-Projekt fuer CrowPanel Advance 5.0 -- Stage 5 (PN532 NFC + SD + RTC + WLAN/ESP-NOW)
;
; Konfiguration 1:1 aus Elecrows eigenem offiziellem Beispiel uebernommen
; (example/V1.2_and_V1.3/PlatfromIO/platformio.ini im offiziellen Repo),
; insbesondere das PSRAM-Takt-Flag -- das ist der Grund fuer den Umstieg
; von der Arduino IDE: der ueber die normale Arduino-Boardverwaltung
; installierte Standard-Core kompiliert PSRAM fest mit 80 MHz statt der
; fuer dieses Board vorgesehenen 120 MHz. Dieses Flag laesst sich nur ueber
; die hier verlinkte (gepatchte) Platform setzen, nicht ueber ein
; Arduino-IDE-Menue.
;
; ARDUINO_USB_MODE/ARDUINO_USB_CDC_ON_BOOT: PlatformIO-Aequivalent zu
; Arduino IDEs "Werkzeuge -> USB CDC On Boot: Enabled" -- noetig, weil der
; PN532 auf IO43/44 (UART0 TX/RX) haengt und die serielle Konsole deshalb
; NICHT ueber UART0 laufen darf, sondern ueber den nativen USB-CDC-Port.
; Ohne diese Flags kollidiert Serial mit dem PN532.
;
; ZUSAETZLICHE LIBRARY-ABHAENGIGKEIT: Adafruit_PN532 braucht ZWEI PATCHES
; (siehe firmware/README.md Abschnitt 3), die lib_deps NICHT automatisch
; mitbringt -- nach der ersten Kompilierung in
; .pio/libdeps/advance-hmi/Adafruit PN532/ manuell nachtragen:
;   1. Adafruit_PN532.h:  #define PN532_PACKBUFFSIZ 64   ->  255
;   2. Adafruit_PN532.cpp, inDataExchange(): Timeout 1000 -> 5000 (ms)

[env:advance-hmi]
platform = https://github.com/Jason2866/platform-espressif32.git
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.partitions = partitions.csv
board_upload.partitions = partitions.csv
build_flags =
	-DCONFIG_SPIRAM_SPEED_120M=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	lovyan03/LovyanGFX@1.2.26
	adafruit/Adafruit PN532@^1.3.3
